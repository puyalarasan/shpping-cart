name: Java CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java files
        run: javac Main.java CartCalculator.java CartCalculatorTest.java

      - name: Run automated test
        run: java CartCalculatorTest

      - name: Run Java application
        run: java Main